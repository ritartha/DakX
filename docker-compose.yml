version: '3.9'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dakx}
      POSTGRES_USER: ${POSTGRES_USER:-dakx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dakx}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dakx}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - '9000:9000'
      - '9001:9001'

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    env_file: .env
    volumes:
      - ./backend:/app

  celery-worker:
    build:
      context: ./backend
      dockerfile: ../docker/celery/Dockerfile
    command: celery -A config worker -l info -c 4
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    volumes:
      - ./backend:/app

  celery-beat:
    build:
      context: ./backend
      dockerfile: ../docker/celery/Dockerfile
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
    volumes:
      - ./frontend:/app

  nginx:
    build:
      context: ./docker/nginx
    ports:
      - '80:80'
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  minio_data:
